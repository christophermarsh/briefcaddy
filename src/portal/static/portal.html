<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f4a85">
<title>%%FIRM%%</title>
<style nonce="%%NONCE%%">
:root {
  --bg: #f5f3ee; --card: #ffffff; --ink: #1c2433; --muted: #5f6878; --faint: #8a93a3; --line: #e3e0d8; --line-strong: #cfcbc1;
  --brand: #1f4a85; --brand-ink: #ffffff; --brand-soft: #e9f0fa; --brand-mid: #c9d9ef;
  --ok: #2b7a4b; --ok-soft: #e6f4ec; --warn: #95600b; --warn-soft: #fdf3e1; --bad: #b42d24; --bad-soft: #fbeaea;
  --radius: 16px; --shadow: 0 1px 2px rgba(28,36,51,.05), 0 4px 16px rgba(28,36,51,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.22em; }
:focus-visible { outline: 3px solid #7aa7e6; outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 50;  /* above the sheets (40): Leave works under an open sheet */ background: var(--brand); color: var(--brand-ink); }
.top .in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.mark { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 13px; letter-spacing: -.3px; }
.saved { font-size: 14px; opacity: 0; transition: opacity .3s; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.saved.on { opacity: .95; }
.top select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 6px 8px; font-size: 15px; }
.top select option { color: var(--ink); }
.iconbtn { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 10px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.progress { height: 5px; background: rgba(255,255,255,.18); }
.progress > div { height: 100%; background: #8fd3a8; transition: width .4s ease; }
/* "Leave this page": small and neutral, top right on every screen; the short word on a phone */
.leave { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 14px; white-space: nowrap; min-height: 44px; min-width: 44px; }
.leave .short { display: none; }
@media (max-width: 480px) { .brand .full { display: none; } .iconbtn span { display: none; } .leave .full { display: none; } .leave .short { display: inline; } .top .in { gap: 8px; padding: 10px 12px; } .top select { max-width: 104px; font-size: 14px; padding: 6px 4px; } }

/* layout */
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .wrap.with-nav { grid-template-columns: 280px minmax(0, 1fr); } }
.content { min-width: 0; max-width: 700px; width: 100%; }
.wrap:not(.with-nav) .content { margin: 0 auto; }

/* step list */
.nav { display: none; }
@media (min-width: 900px) { .wrap.with-nav .nav { display: block; position: sticky; top: 84px; align-self: start; } }
.nav h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 4px 12px 8px; }
.steplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steplist button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; background: transparent; border-radius: 12px; text-align: left; color: var(--ink); }
.steplist button:hover { background: rgba(31,74,133,.06); }
.steplist button.on { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.steplist .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.steplist .done .dot { background: var(--ok-soft); color: var(--ok); }
.steplist .meta { display: block; font-size: 13px; color: var(--faint); font-weight: 400; }

/* mobile step header + sheets */
.mhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
@media (min-width: 900px) { .mhead { display: none; } }
.mhead .txt { flex: 1; min-width: 0; }
.mhead .k { font-size: 13px; color: var(--muted); }
.mhead .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(20,26,38,.42); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .sheet { align-items: center; } }
.sheet .panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px 16px 28px; }
@media (min-width: 700px) { .sheet .panel { border-radius: 20px; } }
.sheet .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet h2 { margin: 0; font-size: 20px; }

/* cards & text */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 18px; margin: 0 0 16px; box-shadow: var(--shadow); }
@media (min-width: 600px) { .card { padding: 28px 30px; } }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.2px; }
h2 { font-size: 19px; margin: 0 0 10px; }
.lead { color: var(--muted); margin: 0 0 4px; }
.shead { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.badge { width: 48px; height: 48px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; font-size: 22px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); background: #f1efe9; border-radius: 999px; padding: 2px 10px; margin-top: 4px; }
.why { display: flex; gap: 10px; background: var(--brand-soft); color: #23446f; border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 0 0 24px; }

/* fields */
.field { margin: 0 0 26px; }
.field:last-child { margin-bottom: 4px; }
.label { display: block; font-weight: 600; margin-bottom: 6px; }
.opt { font-weight: 400; color: var(--faint); font-size: 14px; }
.hint { color: var(--muted); font-size: 15px; margin: -2px 0 8px; }
details.tip { margin: 8px 0 0; font-size: 15px; }
details.tip summary { list-style: none; color: var(--brand); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
details.tip summary::-webkit-details-marker { display: none; }
details.tip p { margin: 8px 0 0; background: #fbf8ef; border: 1px solid #efe6cc; border-radius: 10px; padding: 10px 12px; color: #4b4532; }
input[type=text], input[type=date], input[type=email], input[type=tel], input[type=number], select.in, textarea {
  width: 100%; min-width: 0; padding: 13px 14px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: #fff; transition: border-color .15s, box-shadow .15s; }
input[type=date] { min-height: 52px; }
input:focus, select.in:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,74,133,.12); }
textarea { min-height: 100px; resize: vertical; }
.bad-input { border-color: var(--bad) !important; }
.err { color: var(--bad); font-size: 14px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.count { text-align: right; margin-top: 4px; } .count.over { color: var(--bad); font-weight: 600; }
.choices { display: grid; gap: 10px; }
.choices.two, .choices.three { grid-template-columns: 1fr 1fr; }
.choices.three > :last-child { grid-column: 1 / -1; }
@media (min-width: 640px) { .choices.three { grid-template-columns: 1fr 1fr 1.3fr; } .choices.three > :last-child { grid-column: auto; } }
.choice.unsure { border-style: dashed; }
.choice.box .ring { border-radius: 6px; }
.checklist { display: grid; gap: 8px; }
.checklist .sep { font-size: 13px; color: var(--faint); margin: 6px 0 0; }
.checklist .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 420px) { .checklist .two { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: #f1efe9; border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-size: 15px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(28,36,51,.12); }
.suffix { position: relative; max-width: 220px; }
.suffix input { padding-right: 52px; }
.suffix span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.conv { margin-top: 8px; font-size: 15px; color: var(--ok); display: flex; gap: 6px; align-items: center; }
.guide { margin: -12px 0 18px; }
.guide .steps2 p { margin: 8px 0 0; }
.choice { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: #fff; text-align: left; transition: border-color .15s, background .15s; min-width: 0; }
.choice:hover { border-color: #9fb6d6; }
.choice .ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; color: #fff; font-size: 13px; }
.choice.on { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.choice.on .ring { background: var(--brand); border-color: var(--brand); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid2 > .wide { grid-column: 1 / -1; }
@media (max-width: 420px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.sub { font-size: 14px; color: var(--muted); margin: 0 0 5px; font-weight: 500; }
.entry { border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fcfbf8; }
.entry .top2 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
.entry .field { margin-bottom: 14px; }
.add { width: 100%; border: 1.5px dashed #9fb6d6; background: transparent; color: var(--brand); border-radius: 12px; padding: 12px; font-weight: 600; display: flex; justify-content: center; gap: 6px; align-items: center; }
.link { background: none; border: 0; color: var(--brand); padding: 4px; display: inline-flex; gap: 4px; align-items: center; font-size: 15px; }
.link.danger { color: var(--bad); }

/* buttons & bottom bar */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; padding: 14px 22px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); text-decoration: none; transition: filter .15s, transform .05s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: #fff; color: var(--brand); border: 1.5px solid var(--brand-mid); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.big { width: 100%; padding: 16px 22px; font-size: 18px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(245,243,238,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.actions .in { max-width: 1120px; margin: 0 auto; }
.actions .row { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; }
@media (min-width: 900px) { .actions .in { padding: 0 16px 0 320px; } .actions .row { margin: 0; } .actions .row .btn:not(.ghost) { flex: 0 1 260px; margin-left: auto; } }
.actions .btn { flex: 1; }
.actions .btn.ghost { flex: 0 0 auto; }

/* tasks, notices */
.alert { border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; background: var(--warn-soft); border: 1px solid #f0dcb4; }
.alert h2 { display: flex; align-items: center; gap: 8px; color: var(--warn); font-size: 17px; margin: 0; }
.alert p { margin: 10px 0 8px; }
.alert .opts { display: grid; gap: 8px; margin: 10px 0 6px; }
.alert .opts .btn { background: #fff; color: var(--ink); border: 1.5px solid #e5cf9f; justify-content: flex-start; }
.alert .item + .item { border-top: 1px solid #f0dcb4; margin-top: 10px; }
.asked-line { margin: 16px 0; padding: 14px 16px; }
.asked-line p { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 17px; }
.todo-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 0; border-top: 1px solid #f0dcb4; }
.todo-row > span { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.note.sent { display: flex; gap: 8px; align-items: flex-start; background: var(--ok-soft); color: #1f5a37; }
.note.sent .sub { margin: 2px 0 0; color: inherit; }
.note.safety { margin: 0 0 18px; }
.note.safety .link { display: inline; padding: 0 4px; text-decoration: underline; }
.note { background: var(--brand-soft); color: #23446f; border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 0 0 14px; }

/* welcome */
.hero h1 { font-size: 28px; }
.points { list-style: none; margin: 20px 0 22px; padding: 0; display: grid; gap: 16px; }
.points li { display: flex; gap: 14px; align-items: flex-start; }
.points .badge { width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
.points b { display: block; }
.points span { color: var(--muted); font-size: 15px; }
.ready { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 24px; }
.ready span { background: #f1efe9; border-radius: 999px; padding: 5px 12px; font-size: 14px; }

/* documents */
.doc { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); }
.doc .badge { width: 44px; height: 44px; border-radius: 12px; font-size: 20px; }
.doc { grid-template-columns: 76px minmax(0, 1fr); }
.thumb { width: 76px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; position: relative; align-self: start; }
.thumb img { display: block; width: 100%; height: auto; }
.thumb span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(28,36,51,.66); color: #fff; font-size: 11px; padding: 2px 0; text-align: center; }
.example img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.example p { color: var(--muted); font-size: 15px; }
.mark-hl { display: inline-block; width: 14px; height: 14px; border: 3px solid #f2b705; background: rgba(242,183,5,.16); border-radius: 4px; vertical-align: -2px; }
.doc .name { font-weight: 600; }
.doc .why2 { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.need { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status.opt { background: #f1efe9; color: var(--muted); }
.upl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.upl label { position: relative; overflow: hidden; border-radius: 12px; }
.upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upl label:focus-within { outline: 3px solid var(--accent, #245bc1); outline-offset: 3px; }
.upl .btn { padding: 10px 14px; font-size: 15px; }
.files { margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }

/* review */
.rrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.rrow:first-of-type { border-top: 0; }
.rrow .t { flex: 1; min-width: 0; }
.rrow .ok { color: var(--ok); } .rrow .miss { color: var(--faint); }
.attest { background: #fbf8ef; border: 1px solid #efe6cc; border-radius: 12px; padding: 14px 16px; font-size: 15px; margin: 0 0 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--brand); }

/* done */
/* the agreement and the closed case (src/engagement.py): the letter in the client's language with the English beside it */
.sheet .panel.wide { max-width: 980px; }
.letter2 { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 760px) { .letter2.two { grid-template-columns: 1fr 1fr; } }
.letter2 .copy { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.letter2 .copy h3 { margin: 0 0 8px; font-size: 16px; }
.letter2 .copy .lang { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
.letter2 .copy p { margin: 0 0 10px; }
/* "Your monthly money" and its signing (src/eoir26a.py) */
.moneyin { display: flex; align-items: center; gap: 8px; max-width: 240px; }
.moneyin span { color: var(--muted); font-weight: 600; }
.capture-view { position: relative; background: #111; border-radius: 12px; overflow: hidden; }
.capture-view video, .capture-view img { display: block; width: 100%; max-height: 48vh; object-fit: contain; }
.capture-guide { position: absolute; inset: 10% 12%; pointer-events: none; border: 2px dashed #fff; box-shadow: 0 0 0 999px rgba(0,0,0,.16); }
.capture-guide span { position: absolute; width: 24px; height: 24px; border: 4px solid #ffe078; }
.capture-guide span:nth-child(1) { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.capture-guide span:nth-child(2) { top: -3px; right: -3px; border-left: 0; border-bottom: 0; }
.capture-guide span:nth-child(3) { bottom: -3px; left: -3px; border-right: 0; border-top: 0; }
.capture-guide span:nth-child(4) { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
.capture-controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.capture-outline { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
.capture-outline polygon { fill: none; stroke:#72ffba; stroke-width:4; vector-effect:non-scaling-stroke; }
.capture-outline circle { fill:#ffe078; stroke:#222; stroke-width:2; cursor:move; }
.capture-corners { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
.capture-corners label { display:block; }
.capture-corners input { width:96px; min-height:44px; }
.capture-warning { border-left:4px solid #a96400; padding:8px; }
.money-controls .link { margin: 6px 12px 0 0; }
canvas.pad { width: 100%; aspect-ratio: 4 / 1; background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; touch-action: none; display: block; margin: 6px 0; }
#money-sign .copy { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; font-size: 15px; margin: 6px 0 10px; }
.agree-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.done-mark { width: 76px; height: 76px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 4px auto 14px; font-size: 38px; }
.center { text-align: center; }
/* the case's path (src/journey.py) */
.case h2 { margin: 0 0 4px; }
.case .now { color: var(--muted); margin: 6px 0 14px; }
.path { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 8px; }
.path li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; }
.path .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.path li.done .dot { background: var(--brand); border-color: var(--brand); }
.path li.now { color: var(--ink); font-weight: 700; }
.path li.now .dot { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.path.collapsed li:not(.now) { display: none; }  /* on a phone the ladder shows the current step; "Show all" opens it, so the appointment is on the first screen */
.pathtoggle { display: none; margin: 0 0 6px; }
@media (max-width: 700px) { .pathtoggle { display: inline-flex; } }
@media (min-width: 701px) { .path.collapsed li:not(.now) { display: flex; } }
.happened { margin: 0; padding-left: 18px; color: var(--muted); font-size: 15px; display: grid; gap: 4px; }
.nextstep { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }
.nextstep h3 { margin: 0 0 6px; font-size: 16px; }
.nextstep p { margin: 0; }
.uscis-says { border-left: 4px solid var(--brand-mid); background: var(--card); border-radius: 0 12px 12px 0; padding: 10px 14px; margin: 10px 0; }
.uscis-says .line { font-weight: 700; margin: 0; overflow-wrap: anywhere; }
.uscis-says .desc { margin: 6px 0 0; overflow-wrap: anywhere; }
.estimate { margin: 10px 0 0; }
.faces { display: flex; gap: 10px; margin: 10px 0; }
.faces button { flex: 1; min-height: 64px; display: grid; place-items: center; gap: 2px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px 4px; font-size: 15px; cursor: pointer; color: var(--ink); }
.faces button svg { width: 30px; height: 30px; }
.faces button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.feedback textarea { min-height: 70px; margin-bottom: 8px; }
.appt { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
.appt b { display: block; }
.appt .btn { margin-top: 10px; padding: 10px 14px; font-size: 15px; }
.nextappt { background: var(--brand-soft); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between; }
.nextappt b { display: block; }
.nextappt .btn { padding: 10px 14px; font-size: 15px; }
.badge-n { background: #fff; color: var(--brand); border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px; font-size: 13px; font-weight: 700; display: inline-grid; place-items: center; }
.thread { display: grid; gap: 10px; margin: 6px 0 14px; max-height: 42vh; overflow: auto; }
.bubble { border-radius: 14px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); max-width: 92%; }
.bubble.client { background: var(--brand-soft); border-color: var(--brand-mid); justify-self: end; }
.bubble.office { justify-self: start; }
.bubble .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .sub { margin: 4px 0 0; }
.bubble .sub:first-child { margin: 0 0 4px; }
.bubble .orig { white-space: pre-wrap; overflow-wrap: anywhere; }
.msgbox textarea { min-height: 90px; margin-bottom: 10px; }
.prep .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.prep .row > b { display: block; color: var(--brand); font-size: 14px; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.prep ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.prep .when { font-size: 20px; font-weight: 700; }
.timeline { list-style: none; padding: 0; margin: 14px 0 0; text-align: left; display: grid; gap: 14px; }
.timeline li { display: flex; gap: 12px; }
.timeline .n { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }

/* faq */
.faq details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.faq summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--brand); font-size: 20px; line-height: 1; }
.faq details[open] summary::after { content: "–"; }
.faq p { margin: 0; padding: 0 16px 14px; color: var(--muted); }
.signin { max-width: 460px; margin: 6vh auto 0; }
/* the appointment page prints alone: nothing else on the screen goes to paper */
@media print {
  body { background: #fff; font-size: 14pt; }
  .top, .wrap, .actions, .noprint, .sheetlink, .sheet .head .link { display: none !important; }
  .sheet { position: static; display: block; background: none; }
  .sheet .panel { max-height: none; max-width: none; overflow: visible; padding: 0; background: #fff; border-radius: 0; }
  .prep .row { break-inside: avoid; }
}
.foot { text-align: center; color: var(--faint); font-size: 14px; margin-top: 18px; display: flex; gap: 6px; justify-content: center; align-items: center; }
</style>
</head>

async function sendPhoto(docId, input, btn) {
  if (!input.files.length) return;
  const file = input.files[0];
  if (file.size > 15 * 1024 * 1024) return alert(t("err_too_large"));
  const attempt = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, "0")).join("");
  $("saved").classList.remove("on");
  recovery.uploads.set(attempt, { file, docId, capture: input.capture || null, derivative: input.derivative || null, busy: false, canceled: false, status: "pending", error: null });
  await retryUpload(attempt);
}
async function retryUpload(attempt) {
  const upload = recovery.uploads.get(attempt); if (!upload || upload.busy) return;
  const epoch = recovery.epoch;
  const fd = new FormData(); fd.append("doc_id", upload.docId); fd.append("file", upload.file); fd.append("attempt", attempt);
  if (upload.capture) fd.append("capture_metadata", JSON.stringify(upload.capture));
  if (upload.derivative) fd.append("derivative", upload.derivative);
  upload.controller = new AbortController(); upload.busy = true; upload.canceled = false; upload.error = null; drawRecovery();
  try {
    const result = await api("POST", "/api/upload", fd, true, upload.controller);
    if (epoch !== recovery.epoch) return;
    S.data = result;
    upload.status = result.upload_outcome.status;
    if (upload.status === "complete") { recovery.uploads.delete(attempt); flashSaved(); }
  } catch (e) {
    if (epoch === recovery.epoch && e.message !== "signin" && !upload.canceled) {
      if (e.knownRefusal) { recovery.uploads.delete(attempt); alert(e.message); }
      else upload.error = e.message;
    }
  }
  finally { if (epoch === recovery.epoch) { upload.busy = false; drawRecovery(); keepScroll(render); } }
}
async function checkUpload(attempt) {
  const upload = recovery.uploads.get(attempt); if (!upload) return;
  const epoch = recovery.epoch;
  try {
    const result = await api("GET", "/api/upload-outcome?attempt=" + encodeURIComponent(attempt));
    if (epoch !== recovery.epoch) return;
    S.data = result; upload.status = result.upload_outcome.status;
    if (upload.status === "complete") { recovery.uploads.delete(attempt); alert(rw("upload_done")); }
    else { upload.canceled = false; upload.error = null; }
  } catch (e) { if (epoch === recovery.epoch && e.message !== "signin") upload.error = e.message; }
  if (epoch === recovery.epoch) { drawRecovery(); keepScroll(render); }
}
async function cancelUpload(attempt) {
  const upload = recovery.uploads.get(attempt); if (!upload) return;
  upload.canceled = true; upload.controller?.abort(); upload.busy = false; drawRecovery();

  // Removing the local file/handle never asserts that the server deleted it.
  if (confirm(rw("discard_file"))) { recovery.uploads.delete(attempt); drawRecovery(); }
}

function questionnaireDownload() {
  const status = el("p", { role: "alert", hidden: true });
  const submittedData = S.data;
  let busy = false;
  const link = el("a", { class: "btn", href: "/api/questionnaire.pdf", onclick: async (event) => {
    event.preventDefault();
    if (busy) return;
    busy = true; link.setAttribute("aria-disabled", "true"); status.hidden = true;
    link.textContent = (PDF_WORDS[S.lang] || PDF_WORDS.en).loading;
    try {
      const response = await fetch("/api/questionnaire.pdf", { credentials: "same-origin", cache: "no-store" });
      if (!response.ok || !(response.headers.get("Content-Type") || "").includes("application/pdf")) throw new Error("pdf_download");
      const blob = await response.blob();
      if ((await blob.slice(0, 5).text()) !== "%PDF-") throw new Error("pdf_download");
      if (!link.isConnected || S.data !== submittedData) return;
      const url = URL.createObjectURL(blob);
      const save = el("a", { href: url, download: "submitted-questionnaire.pdf" });
      document.body.append(save); save.click(); save.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (error) {
      if (link.isConnected && S.data === submittedData) {
        status.textContent = (PDF_WORDS[S.lang] || PDF_WORDS.en).error; status.hidden = false;
      }
    } finally {
