<h1 id="title">Service messages · Mensagens · Mensajes · Mesaj</h1>
<p id="intro"></p><p id="access"></p>

</section></main>

minó. Contacte a la oficina si necesita otro enlace de acceso.',logout:'Cerrar sesión',signedout:'Ha cerrado la sesión.',error:'No se pudo confirmar esta opción. Puede intentar la misma opción otra vez. Si cambió el contacto o aviso, abra de nuevo su enlace o contacte a la oficina.',unavailable:'El acceso actual o el texto revisado no está disponible. Abra de nuevo su enlace o contacte a la oficina.',portal:'Volver al cuestionario',email:'Correo electrónico',sms:'SMS',whatsapp:'WhatsApp',pending:'No hay permiso actual registrado',granted:'Permiso registrado',revoked:'Permiso retirado',disabled:'Envío no disponible'},

const $=id=>document.getElementById(id);let context=null,copy=COPY.en,attempt=null,busy=false;
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:body===undefined?{}:{'Content-Type':'application/json','X-Portal':'1'},body:body===undefined?undefined:JSON.stringify(body)});if(!response.ok)throw new Error('not_confirmed');return response.json();}
function status(text){$('status').textContent=text;}
function controls(locked){busy=locked;for(const button of document.querySelectorAll('button'))button.disabled=locked;for(const input of document.querySelectorAll('input'))input.disabled=locked||(input.type==='radio'&&input.dataset.enabled!=='true');}
function render(value){context=value;copy=COPY[value.language];if(!copy)throw new Error('unreviewed_language');document.documentElement.lang=value.language;document.title=copy.title;
for(const [id,key] of Object.entries({title:'title',intro:'intro',noticeHeading:'notice',channelHeading:'channels',phone:'phone',nameLabel:'name',agreeLabel:'agree',save:'save',withdrawHelp:'withdrawHelp',withdraw:'withdraw',logout:'logout',portalLink:'portal'}))$(id).textContent=copy[key];
const verified=value.access_purpose==='verify_contact'&&value.channels.some(row=>row.channel===value.verified_channel&&row.control_verified===true);
$('verification').hidden=!verified;$('choiceForm').hidden=verified;$('phone').hidden=verified;
if(verified){$('intro').textContent=copy.verificationIntro;$('verifiedHeading').textContent=copy.verifiedHeading;$('verifiedResult').textContent=copy.verifiedResult+' '+copy[value.verified_channel]+': '+value.channels.find(row=>row.channel===value.verified_channel).destination;$('verificationNext').textContent=copy.verificationNext;$('requestSignIn').textContent=copy.requestSignIn;}
$('access').textContent=verified?copy.verifiedScope:value.consent_only?copy.limited:copy.full;$('notice').textContent=value.notice;$('noticeVersion').textContent=copy.version+value.notice_version;
$('portalLink').hidden=value.consent_only;$('channels').replaceChildren();
for(const option of value.channels){const label=document.createElement('label');label.className='channel';const radio=document.createElement('input');radio.type='radio';radio.name='channel';radio.value=option.channel;radio.required=true;radio.dataset.enabled=String(option.choice_ready===true);radio.disabled=option.choice_ready!==true;radio.addEventListener('change',()=>{attempt=null;});label.append(radio,document.createTextNode(copy[option.channel]+': '+option.destination));const state=document.createElement('small');state.textContent=(copy[option.state]||copy.pending)+(option.choice_ready?'':' · '+copy.disabled);label.append(state);$('channels').append(label);}
$('agree').checked=false;$('content').hidden=false;attempt=null;}
function identity(){const bytes=crypto.getRandomValues(new Uint8Array(16));return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}
$('typedName').addEventListener('input',()=>{attempt=null;});$('agree').addEventListener('change',()=>{attempt=null;});
$('choiceForm').addEventListener('submit',async event=>{event.preventDefault();if(busy||!context||!$('choiceForm').reportValidity())return;const selected=document.querySelector('input[name=channel]:checked');if(!selected||!$('agree').checked)return;
if(!attempt){const option=context.channels.find(row=>row.channel===selected.value);attempt={scope:context.scope,notice_version:context.notice_version,language:context.language,wording_sha256:context.wording_sha256,revision:context.revision,channel:option.channel,destination_sha256:option.destination_sha256,agree:true,typed_name:$('typedName').value.trim(),action_id:identity()};}
controls(true);try{await api('/api/communication/consent',attempt);status(copy.saved);const next=await api('/api/communication/consent');render(next);status(copy.saved);}catch(_){status(copy.error);}finally{controls(false);}});
$('requestSignIn').addEventListener('click',async()=>{if(busy||!context||context.access_purpose!=='verify_contact')return;const option=context.channels.find(row=>row.channel===context.verified_channel&&row.control_verified);if(!option)return;controls(true);try{await api('/api/link',{contact:option.destination,channel:option.channel});status(copy.linkRequested);}catch(_){status(copy.error);}finally{controls(false);}});
$('withdraw').addEventListener('click',async()=>{if(busy||!context)return;controls(true);try{await api('/api/communication/revoke',{scope:'service_notifications',channels:['email','sms','whatsapp']});$('content').hidden=true;context=null;attempt=null;status(copy.withdrawn);}catch(_){status(copy.error);controls(false);}});
$('logout').addEventListener('click',async()=>{if(busy)return;controls(true);try{await api('/api/logout',{});$('content').hidden=true;context=null;attempt=null;status(copy.signedout);}catch(_){status(copy.error);controls(false);}});
api('/api/communication/consent').then(value=>{render(value);status('');}).catch(()=>{status(Object.values(COPY).map(value=>value.unavailable).join('\n'));});
