<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style nonce="%%NONCE%%">
:root {
  --bg: #f5f6f8; --panel: #ffffff; --raised: #f9fafb; --ink: #111827; --ink-2: #374151; --muted: #6b7280; --faint: #9ca3af;
  --line: #e6e8ec; --line-2: #d6dae1;
  --brand: #ffffff; --brand-2: #3730a3; --brand-ink: #111827; --brand-soft: #eef0ff;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff;
  --block: #c0262d; --block-bg: #fdf0f0; --block-line: #f5c6c8;
  --warn: #92560a; --warn-bg: #fff8eb; --warn-line: #f4dcae;
  --ok: #0f7a4b; --ok-bg: #ecf8f2; --ok-line: #b9e4cf;
  --info: #1d4ed8; --info-bg: #eff4ff; --info-line: #cddbfb;
  --legal: #6d3fc0; --legal-bg: #f5f0ff; --legal-line: #ddd0f7;
  --shadow: 0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03); --shadow-lg: 0 12px 32px rgba(17,24,39,.12);
  --radius: 14px; --radius-sm: 10px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d12; --panel: #12151c; --raised: #171b24; --ink: #e8ebf2; --ink-2: #c4cad6; --muted: #8d95a8; --faint: #646c80;
    --line: #232837; --line-2: #2e3446; --brand: #12151c; --brand-2: #c7d2fe; --brand-ink: #e8ebf2; --brand-soft: #1b2140;
    --accent: #8b9cff; --accent-ink: #0b0d12; --accent-soft: #1d2346;
    --block: #ff8b80; --block-bg: #331614; --block-line: #5e2620; --warn: #f5bd5b; --warn-bg: #2d220c; --warn-line: #574116;
    --ok: #5fd69a; --ok-bg: #0f2a1d; --ok-line: #1d5236; --info: #8fb6ff; --info-bg: #13223a; --info-line: #24406a;
    --legal: #c4a8ff; --legal-bg: #221a38; --legal-line: #3b2c61;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) img.scan { filter: brightness(.92); }
}
:root[data-theme="dark"] {
    --bg: #0b0d12; --panel: #12151c; --raised: #171b24; --ink: #e8ebf2; --ink-2: #c4cad6; --muted: #8d95a8; --faint: #646c80;
    --line: #232837; --line-2: #2e3446; --brand: #12151c; --brand-2: #c7d2fe; --brand-ink: #e8ebf2; --brand-soft: #1b2140;
    --accent: #8b9cff; --accent-ink: #0b0d12; --accent-soft: #1d2346;
    --block: #ff8b80; --block-bg: #331614; --block-line: #5e2620; --warn: #f5bd5b; --warn-bg: #2d220c; --warn-line: #574116;
    --ok: #5fd69a; --ok-bg: #0f2a1d; --ok-line: #1d5236; --info: #8fb6ff; --info-bg: #13223a; --info-line: #24406a;
    --legal: #c4a8ff; --legal-bg: #221a38; --legal-line: #3b2c61;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
}
:root[data-theme="dark"] img.scan { filter: brightness(.92); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14.5px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
h1, h2, h3 { letter-spacing: -.015em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar: a quiet surface, not a colored band */
.topbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); color: var(--ink); }
.topbar .in { display: flex; align-items: center; gap: 12px; padding: 10px 22px; max-width: 1560px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; white-space: nowrap; }
.brand .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 750; letter-spacing: .3px; }
.brand .sub { font-weight: 450; color: var(--muted); }
.topbar select, .topbar input[type=text] { background: var(--raised); border: 1px solid var(--line); color: var(--ink); border-radius: var(--radius-sm); padding: 7px 11px; }
.topbar input::placeholder { color: var(--faint); }
.topbar .who { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); white-space: nowrap; font-size: 13.5px; }
/* The Search box is a small, fixed place in the bar (the buttons beside it fill the bar on a case); while it has focus it
   opens over its neighbours to a usable width. Enter searches. */
.topbar #find { position: relative; flex: 0 1 170px; min-width: 80px; height: 34px; margin: 0; }  /* gives way when the bar is full (a case page), down to 80 */
.topbar #find input { position: absolute; top: 0; right: 0; width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 10px; transition: width .12s; }
@media (max-width: 1420px) { .topbar .in { gap: 8px; padding: 10px 14px; } .topbar #find { flex-basis: 146px; } .topbar #find input { padding: 7px 8px; } }  /* a 1366-pixel laptop: the bar fits without pushing the page sideways */
@media (max-width: 1300px) { .topbar #find { flex-basis: 80px; } }
@media (max-width: 1100px) { .topbar .in { flex-wrap: wrap; row-gap: 8px; } .topbar .spacer { display: none; } .topbar .who { margin-left: auto; } }  /* a narrow window: the bar takes a second line, never a sideways scroll (buyer visit 5: 103 pixels at 800) */
/* fitSearchWords(): the placeholder is "Search documents" where it fits in full, else "Search": never cut to "Search doc" */
.topbar #find input:focus { width: 240px; z-index: 40; box-shadow: var(--shadow-lg); }
@media (max-width: 1300px) { .topbar:has(#find input:focus) .who { opacity: 0; } }  /* in a narrow window the open box reaches over the signed-in name: it steps aside while you type, never half covered */
.topbar #find input:focus { left: 0; right: auto; }  /* it opens to the right, over the empty part of the bar, never over Settings or Choose a client (buyer visit 3: the white pill) */
mark { background: color-mix(in srgb, var(--accent) 26%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.hits td { vertical-align: top; }
#documents tr.found td { background: color-mix(in srgb, var(--accent) 12%, transparent); transition: background .4s; }
.thread-panel { margin-top: 18px; }
.client-note { margin-top: 4px; max-width: 190px; }
.hits .snip { color: var(--ink-2); font-size: 13px; margin-top: 3px; max-width: 640px; overflow-wrap: anywhere; }
.searchbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.searchbar input[type=search] { flex: 1 1 280px; min-width: 200px; width: auto; }
.topbar #client { flex: 0 1 280px; min-width: 120px; max-width: 280px; text-overflow: ellipsis; }
.pick { position: fixed; z-index: 60; width: min(432px, calc(100vw - 16px)); background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 8px; }
.pick input { width: 100%; box-sizing: border-box; }
.pick-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: min(60vh, 440px); overflow-y: auto; }
.pick-item { padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.pick-item.on, .pick-item:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pick-note { padding: 6px 10px 0; }
.topbar .who .me { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1500px) { .brand .sub { display: none; } }
@media (max-width: 1500px) { .brand .name { display: none; } }  /* the Search box needs the room: the mark and the page title say which app this is */
.spacer { flex: 1; }
.office-pick, .q-pick { font: inherit; font-weight: 650; padding: 1px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: var(--radius-sm); padding: 7px 14px; cursor: pointer; font-weight: 560; white-space: nowrap; transition: border-color .15s, background .15s, box-shadow .15s; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger-ghost { background: transparent; color: var(--block); border-color: var(--block-line); box-shadow: none; }
.btn.small { padding: 5px 11px; font-size: 13px; }
#my-cases[hidden], .assignment-retry[hidden] { display: none; }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.topbar .btn { box-shadow: none; }
.topbar .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 4px; cursor: pointer; font-weight: 560; }
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: var(--raised); }
.theme button { border: 0; background: none; color: var(--muted); border-radius: 99px; padding: 4px 8px; cursor: pointer; display: grid; place-items: center; }
.theme button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

/* case header */
.case { background: var(--panel); border-bottom: 1px solid var(--line); }
.case .in { max-width: 1560px !important; }
.case .in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 16px 20px; max-width: 1480px; margin: 0 auto; }
.case .in:has(> .tiles) { grid-template-columns: minmax(240px, 1fr) minmax(0, 4fr); }  /* eight stage tiles share the row with the heading: they narrow, never run over it */
@media (max-width: 1000px) { .case .in, .case .in:has(> .tiles) { grid-template-columns: 1fr; } }
.case .who h1 { font-size: 22px; margin: 0; font-weight: 700; }
.case .who { min-width: 240px; }  /* the all-clients tiles must not squeeze the heading onto two lines */
.case .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-top: 4px; }
.case .meta b { color: var(--ink-2); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.tag.cat { background: var(--brand-soft); color: var(--brand-2); border-color: var(--info-line); }
:root .tag.cat { color: var(--info); }
.ready { display: flex; align-items: center; gap: 16px; }
.status { display: flex; align-items: center; gap: 10px; border-radius: var(--radius-sm); padding: 9px 14px; border: 1px solid; font-weight: 600; }
.status small { display: block; font-weight: 400; color: var(--muted); }
.status.block { background: var(--block-bg); border-color: var(--block-line); color: var(--block); }
.status.work { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.status.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.meter { min-width: 190px; }
.meter .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.meter .row b { color: var(--ink); }
.meter .track { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }

/* layout */
.layout { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 26px; max-width: 1560px; margin: 0 auto; padding: 24px 22px 60px; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; } }
.side { position: sticky; top: 74px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
.queues { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; box-shadow: var(--shadow); }
.queues button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; color: var(--ink-2); }
.queues button:hover { background: var(--raised); }
.queues button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.queues .nm { flex: 1; }
.queues .n { min-width: 24px; text-align: center; border-radius: 99px; padding: 0 7px; font-size: 12px; font-weight: 650; background: var(--line); color: var(--ink-2); }
.queues .n.block { background: var(--block); color: #fff; }
.queues .n.zero { background: var(--ok-bg); color: var(--ok); }
.jump { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 6px 6px; box-shadow: var(--shadow); }
.jump h4, .side h4 { margin: 0 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); }
.jump button { width: 100%; display: flex; justify-content: space-between; border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.jump button:hover { background: var(--raised); color: var(--ink); }
.jump .c { color: var(--faint); }
.legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
.legend div { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
.legend.guide summary { cursor: pointer; list-style: none; }
.legend.guide summary::-webkit-details-marker { display: none; }
.legend.guide summary h4::after { content: " ▸"; }
.legend.guide[open] summary h4::after { content: " ▾"; }
.legend .gitem { display: grid; grid-template-columns: 1fr; gap: 3px; align-items: start; margin: 8px 0; }
.legend .gitem .badge { width: max-content; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }

/* main column */
.pagehead { display: flex; align-items: flex-end; gap: 12px; margin: 2px 0 14px; }
.pagehead h2 { margin: 0; font-size: 20px; font-weight: 700; }
.pagehead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.pagehead .tools { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; }  /* wraps in a narrow window instead of widening the page */
.kbd { font: 11px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--raised); color: var(--muted); }
.parthead { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .7px; font-weight: 650; }
.parthead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; background: var(--panel); border: 1px dashed var(--line-2); border-radius: var(--radius); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 16px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 90px; }
.card.blocking { border-color: var(--block-line); box-shadow: inset 4px 0 0 var(--block), var(--shadow); }
.card .head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 650; margin-bottom: 4px; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 650; text-transform: none; letter-spacing: 0; border: 1px solid; }
.badge.blocking { background: var(--block-bg); color: var(--block); border-color: var(--block-line); }
.badge.fix { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.badge.check { background: var(--info-bg); color: var(--info); border-color: var(--info-line); }
.badge.legal { background: var(--legal-bg); color: var(--legal); border-color: var(--legal-line); }
.badge.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.card h3 { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 650; }
.official { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.official summary { cursor: pointer; color: var(--accent); width: max-content; }
.official p { margin: 6px 0 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); }
.card .body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; padding: 18px 20px 20px; }
.card .body.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .card .body { grid-template-columns: minmax(0, 1fr); } }
.evidence { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.evidence .cap { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.evidence .cap .doc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
img.scan { max-height: 280px; object-fit: contain; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; display: block; }
details.how { font-size: 12.5px; color: var(--muted); }
details.how summary { cursor: pointer; width: max-content; }
details.how div { margin: 3px 0; overflow-wrap: anywhere; }
/* where the case stands (src/journey.py) */
.jpath { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.jpath span { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.jpath span.done { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.jpath span.now { background: var(--info-bg); border-color: var(--info-line); color: var(--info); font-weight: 700; }
.due { font-weight: 650; white-space: nowrap; }
.due.overdue, .due.urgent { color: var(--block); }
.due.soon { color: var(--warn); }
.due.passed { color: var(--muted); font-weight: 500; }  /* long past: history, not an alarm */
/* the month view on What's due: a plain grid, Monday first; each event wears its deadline's level colour */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; min-width: 660px; }
.mgrid .mh { background: var(--raised); padding: 6px 8px; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); }
.mday { background: var(--panel); min-height: 92px; padding: 4px 6px 6px; text-align: left; border: 0; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.mday.out { background: var(--raised); color: var(--faint); }
.mday.weekend { background: var(--raised); }
.mday.today .mnum { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 7px; }
.mday.picked { outline: 2px solid var(--accent); outline-offset: -2px; }
.mday:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mnum { font-size: 12px; font-weight: 650; align-self: flex-start; }
.mshut { font-size: 11px; color: var(--legal); background: var(--legal-bg); border-radius: 4px; padding: 0 4px; }
.mchip { font-size: 11.5px; line-height: 1.25; padding: 1px 4px; border-left: 3px solid var(--info); color: var(--ink-2); background: var(--info-bg); border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchip.overdue, .mchip.urgent { border-left-color: var(--block); background: var(--block-bg); }
.mchip.soon { border-left-color: var(--warn); background: var(--warn-bg); }
.mchip.passed { border-left-color: var(--muted); background: var(--raised); color: var(--muted); }
.mmore { font-size: 11px; color: var(--muted); }
.tl { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 10px 14px; font-size: 13.5px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.tl li.uscis::before { background: var(--info); } .tl li.uscis_status::before { background: var(--panel); border: 2px solid var(--info); } .tl li.court::before { background: var(--legal); } .tl li.future::before { background: #fff; border: 2px solid var(--line); }
.tl .d { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.sources .src { flex-wrap: wrap; min-width: 0; }
.sources .source-detail { flex-basis: 100%; }
.document-reading pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24rem; overflow-y: auto; font: inherit; font-size: 12px; }
.source-detail { margin: 4px 0; max-width: 100%; overflow-wrap: anywhere; }
.source-preview { margin: 0 0 12px; }
.source-preview figcaption { margin-top: 5px; font-size: 12.5px; color: var(--muted); }

// The client's declaration (src/drafting.py): the client's own answers, word for word, in the order the questions ask them, each

const ENGLISH_HOW = { original: "The client's own words, in English.", machine: "Machine translation, a DRAFT: the firm's certified translator checks it.",
  edited: "", none: "No English yet." };
function declarationPanel(client, filing, d) {
  const act = async (body, done) => {
    if (!reviewer()) return toast("Enter your name first: every change records who made it.", true);
    try { await api("/api/declaration", { client, filing, reviewer: reviewer(), ...body }); toast(done || "Saved."); if (S.client === client && S.tab === "packet") render(); }
    catch (e) { toast(e.message, true); }

      + "in the order the questions ask them. Nothing is added. The English beside an answer in another language is a machine translation until a person "
      + "corrects it here; every edit is recorded with who, when and the text before. DRAFT until the client signs."));
  const approved = d.practice.state === "approved";

      if (!reviewer()) return toast("Enter your name first: every approval records who gave it.", true);
      if (!confirm(`Approve the drafting practice for every case, as ${reviewer()}?\n\n${d.practice.plain_text}\n\nYour name, today's date and this text are recorded.`)) return;
      try { await api("/api/rules/approve", { rule: d.practice.id, reviewer: reviewer() }); toast("Approved."); render(); } catch (e) { toast(e.message, true); }
    } }, "Approve the drafting practice"))));
  else box.append(el("div", { class: "sub" }, `Drafting practice: ${d.practice.text}.`));
  if (!d.paragraphs.length) {
    box.append(el("div", { class: "empty", style: "padding:14px" }, el("b", {}, "No answers yet"),
      "The declaration is made from the client's answers to these questions above: " + d.questions.map((x) => x.label.replace(/^In the client's own words(, [^:]+)?: /, "")).join("; ") + "."));

  }
  const tools = el("div", { class: "actions", style: "margin:10px 0" });

    el("span", { class: "hint" }, "Only articles, capitals, spacing and the final full stop may change; nothing is used until a person accepts it."));
  if (tools.childNodes.length) box.append(tools);

    `Confirm the language of ${d.unsure} paragraph${d.unsure > 1 ? "s" : ""} below: the declaration can't be marked final until then.`)));
  for (const p of d.paragraphs) {
    const src = p.source.kind === "document" && p.source.doc ? `Read from ${docName(p.source.doc)}` : p.source.words;
    const name = p.included ? `paragraph ${p.n}` : `the left-out paragraph (${p.label})`;

        el("span", { class: "badge " + (p.english_how === "edited" ? "check" : p.english_how === "machine" || p.english_how === "none" ? "fix" : "done") },
          p.english_how === "edited" ? "Edited" : p.english_how === "machine" ? "Machine English" : p.english_how === "none" ? "No English yet" : "Client's words"),
        p.language_sure ? null : el("span", { class: "badge fix" }, "Language not certain")),
      el("div", { class: "sub" }, `${src}${p.source.date ? ", " + p.source.date : ""}. ${p.language_name} (${p.language_how}).`));

    two.append(el("div", {}, el("div", { class: "hint" }, "English (as it goes in the declaration)"), text,
      el("div", { class: "sub" }, ENGLISH_HOW[p.english_how] || "", p.made_by ? ` Made by ${p.made_by.who}, ${usDay(p.made_by.at)}.` : "")));
    card.append(two);

      const line = (word, skip) => el("div", { class: "decl-line" }, el("b", {}, word + ": "), (s.diff || []).filter((x) => x.op !== skip).map((x) => [el("span", { class: x.op === "same" ? "" : x.op }, x.text), " "]));

        s.accepted ? el("div", { class: "actions", style: "margin-top:6px" },
          el("button", { class: "btn small", onclick: () => act({ action: "accept", id: p.id }, "Suggestion accepted.") }, icon("check"), "Accept the suggestion"),
          el("button", { class: "btn small ghost", onclick: () => act({ action: "decline", id: p.id }, "Suggestion declined.") }, "Decline")) : null));
    }
    const actions = el("div", { class: "actions", style: "margin-top:8px" },
      el("button", { class: "btn small", onclick: () => act({ action: "edit", id: p.id, text: text.value }, "Paragraph saved.") }, icon("check"), "Save the paragraph"));
    if (p.edit) actions.append(el("button", { class: "btn small ghost", onclick: () => act({ action: "revert", id: p.id }, "Back to the client's words.") },

    "It is out of the packet until the attorney marks it as the client's final again.")));
  if (d.final) {
    end.append(el("div", {}, el("b", {}, `Marked as the client's final by ${d.final.who} on ${d.final.date}. `),
      d.signed ? `Signed by the client on ${d.signed.date} (recorded by ${d.signed.who}).` : "DRAFT until the client signs.",
      " ", d.pdf ? el("a", { class: "linkbtn", href: "/api/declaration.pdf?" + q({ client, filing, t: (d.signed || d.final).at }), target: "_blank", rel: "noopener" }, icon("ext"),
        d.signed ? " Open the signed declaration" : " Open the DRAFT declaration") : null));
    const row = el("div", { class: "actions", style: "margin-top:8px" });
    if (!d.signed) {
      const day = el("input", { type: "date", max: officeToday(), "aria-label": "The date the client signed" });
      row.append(el("label", { class: "hint" }, "The client signed on ", day),
        el("button", { class: "btn small primary", onclick: () => act({ action: "signed", date: day.value }, "Signature recorded.") }, icon("check"), "Record the client's signature"));
    }
    if (!isParalegal()) row.append(el("button", { class: "btn small danger-ghost", onclick: () => act({ action: "take_back" }, "The final mark was taken back.") }, "Take back the final mark"));
    end.append(row);
  } else if (approved && !isParalegal()) {
    end.append(el("div", { class: "actions" }, el("button", { class: "btn small primary", onclick: () => act({ action: "final" }, "Marked as the client's final.") }, icon("check"), "Mark as the client's final"),
      el("span", { class: "hint" }, "Keeps the text as it is now and puts it in the packet, DRAFT until the client signs.")));
  } else {

  }

  // the cover letter's own paragraph for this case, each sentence with the facts it states and where they came from
  if (d.cover && d.cover.sentences.length) box.append(el("details", { class: "decl-cover" }, el("summary", { class: "sub" }, "The cover letter's paragraph about this case (DRAFT wording for the attorney)"),
    el("ol", { class: "sub", style: "margin:6px 0 0 18px" }, d.cover.sentences.map((s) => el("li", {}, s.text,

// Foreign-language documents (src/translation.py): the machine's DRAFT translation, the translator who signs, the certificate of translation.
function translationsPanel(client, filing, list) {
  const act = async (id, body, done) => {

      + "The machine drafts the translation on this computer; it is a DRAFT until the translator has checked it against the original and signed. Only a signed translation goes in the packet."));
  for (const e of list) {

    if (e.problem) card.append(el("div", { class: "callout fix", style: "margin-top:8px" }, icon("alert"), el("div", {}, say(e.problem))));
    const how = [e.how === "machine" && e.made_by ? `Machine translation (${e.engine || "offline translator"}), made by ${e.made_by.who}, ${ago(e.made_by.at)}.` : "",
      e.typed_by ? `Typed by ${e.typed_by.who}, ${ago(e.typed_by.at)}.` : "", e.corrected_by ? `Corrected by ${e.corrected_by.who}, ${ago(e.corrected_by.at)}.` : "",
      ...(e.history || []).map((h) => `A signature by ${h.by} on ${h.date} was taken back by ${h.taken_back.who}, ${ago(h.taken_back.at)}.`)].filter(Boolean).join(" ");

      el("option", { value: "" }, e.translators.length ? "Choose the translator…" : "No translator set up for this language"),
      e.translators.map((t) => el("option", { value: t.id, selected: !!(e.translator && e.translator.id === t.id) }, `${t.name} (${t.kind_name})`)));
    sel.addEventListener("change", () => sel.value && act(e.id, { action: "translator", translator: sel.value }, "Translator chosen."));
    const text = el("textarea", { rows: 8, "aria-label": `English translation of the ${e.name.toLowerCase()}`, style: "margin-top:6px", disabled: false }, e.text || "");

    card.append(row);

      card.append(el("div", { style: "margin-top:8px" }, el("button", { class: "btn small", onclick: () => act(e.id, { action: "make", again: !!e.text }, "Translation made.") }, icon("refresh"),
        e.text ? "Translate again with the machine" : "Make the translation")));
    card.append(el("label", { class: "setfield", style: "margin-top:8px" }, el("span", { class: "setlbl" }, e.text ? "English translation (the translator's corrections go here)" : "English translation (typed by the translator)"), text));
    const actions = el("div", { class: "actions", style: "margin-top:8px" },
      el("button", { class: "btn small", onclick: () => act(e.id, { action: "text", text: text.value }, "Translation saved.") }, icon("check"), "Save the translation"));
    if (e.pdf) actions.append(el("a", { class: "btn small", href: "/api/translation.pdf?" + q({ client, id: e.id, t: e.signed ? e.signed.at : "" }), target: "_blank", rel: "noopener" }, icon("ext"),

    if (signed) {

// Ready to mail? (src/prefile.py): every check an attorney runs before a packet leaves -- then the mailing, recorded.
const CHECK_ICON = { pass: ["check", "var(--ok)"], fail: ["block", "var(--block)"], warn: ["alert", "var(--warn)"], info: ["info", "var(--info)"] };
function mailingPanel(client, filing, title, online, uscis) {  // online: filed in a portal (EOIR, CEAC), not mailed; uscis: uploaded in the firm's USCIS online account

  const UPLOAD = "USCIS online account";  // src/prefile.py: its receipt number comes later, from the case card

    const rows = el("table", { class: "rows" }, el("tr", {}, el("th", { colspan: 2 }, r.ready ? `Ready to ${online ? "file" : "mail"}. Every check passed` : `Ready to ${online ? "file" : "mail"}? Not yet`)));
    for (const c of r.checks) {
      const [ic, color] = CHECK_ICON[c.level];
      const mark = icon(ic); mark.style.color = color;
      rows.append(el("tr", {}, el("td", { style: "width:28px" }, mark), el("td", {}, el("b", {}, c.title + ". "), c.text)));

    const when = el("input", { type: "date", value: today, max: today, "aria-label": uscis ? "Date filed" : "Date mailed" });
    const carrier = el("select", { "aria-label": "Carrier" }, r.carriers.filter((c) => uscis ? c === UPLOAD : c !== UPLOAD).map((c) => el("option", { value: c, selected: online && c === (uscis ? UPLOAD : "Online") }, c)));
    const label = (c) => (c === UPLOAD ? "Receipt number" : c === "Online" ? "Confirmation number" : "Tracking number");
    const tracking = el("input", { type: "text", placeholder: uscis ? "Receipt number, if shown yet" : label(online ? "Online" : ""), "aria-label": label(uscis ? UPLOAD : online ? "Online" : ""), style: "width:260px" });
    carrier.addEventListener("change", () => { tracking.placeholder = label(carrier.value); tracking.setAttribute("aria-label", label(carrier.value)); });
    const why = el("input", { type: "text", placeholder: `Reason to ${online ? "file" : "mail"} despite the failed checks (attorney)`, style: "width:100%;display:" + (r.ready ? "none" : "block") });
    const record = el("button", { class: "btn primary", disabled: isParalegal(), title: isParalegal() ? "An attorney records the mailing." : "", onclick: async () => {
      if (!reviewer()) return toast("Enter your name first: the filing record says who mailed it.", true);
      const net = carrier.value === "Online" || carrier.value === UPLOAD;
      if (!confirm(`Record that this ${filing.startsWith("rfe:") ? "response" : title || filing.toUpperCase() + " packet"} was ${carrier.value === UPLOAD ? "filed in the USCIS online account" : net ? "filed online" : "mailed"} on ${when.value}${net ? "" : " by " + carrier.value}?`)) return;
      try { const done = await api("/api/filed", { client, filing, mailed_on: when.value, carrier: carrier.value, tracking: tracking.value, override: why.value || null, reviewer: reviewer() });
        // the client's page is written now when the client is in the portal (journey.push_client); otherwise the overnight run does it, and the toast says so
        const page = done.client_page === "now" ? "The case timeline is updated, and the client's page shows it now."
          : done.client_page === "tonight" ? "The case timeline is updated. The client's page will show it tonight."

        toast(`${net ? "Filing" : "Mailing"} recorded. ${page}`); render(); }
      catch (e) { toast(e.message, true); }
    } }, icon("check"), online ? "Record the filing" : "Record the mailing");
    // a filing made in the USCIS online account: its receipt number, once the case card shows it (anyone may add it)
    const receiptBox = (f) => {
      const input = el("input", { type: "text", placeholder: "Receipt number from the case card", "aria-label": "Receipt number from the case card", style: "width:220px;margin-left:8px" });

    el("div", { class: "pagehead" }, el("div", {}, el("h2", {}, "Getting started"),

    el("section", { class: "group", style: "overflow-x:auto" }, t),
    g.also_due.length ? [el("div", { class: "pagehead", style: "margin-top:22px" }, el("div", {}, el("h2", {}, "Also due"),
        el("p", {}, "Upkeep the firm looks after that is due now."))),
      el("section", { class: "group", style: "overflow-x:auto" }, el("table", { class: "rows", id: "also-due" },
        g.also_due.map((x) => el("tr", {}, el("td", {}, x.what, x.findings.map((f) => el("div", { class: "err", style: "margin-top:4px" }, f))),
          el("td", { class: "a" }, el("button", { class: "btn small", onclick: () => (x.settings ? showSettings(x.settings) : showMaintenance()).catch((e) => toast(e.message, true)) },
            x.settings ? "Open" : "Open Keeping current"))))))] : null);

// A staff member turned off (or signed out elsewhere) while this page is open: the page asks every 10 seconds, and when this tab
// comes back into view, whether its sign-in still stands; when it does not, every name on the page is cleared at once and the
// sign-in screen shows (the server already refuses the data: this clears what was on the screen).
async function stillSignedIn() {
  if (!ME.accounts || !ME.user) return true;
  let m;
  try {
    const res = await fetch("/api/me");
    if (res.status === 401) m = { user: null };
    else if (res.ok) m = await res.json();
    else return true;  // the server busy or restarting: asked again in 10 seconds
  } catch (e) { return true; }  // offline for a moment: the same
  if (m.user && !m.user.must_change) return true;
  signedOutScreen();
  return false;
}
function signedOutScreen() {
  ME.user = null; S.client = null; S.data = null; S.overview = null;
  put($("client")); put($("side")); put($("case")); put($("main"));
  $("find-q").value = ""; $("toast").style.display = "none"; $("lightbox").style.display = "none";
  showSignIn();
}
function watchSignIn() {
  if (!ME.accounts || watchSignIn.on) return;
  watchSignIn.on = setInterval(stillSignedIn, 10000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") stillSignedIn(); });
}

// "Choose a client": the list opens under the box with a search field. Type any part of the name, the kind of case or the id; arrows and Enter pick.
// The select stays the one place that holds the choice (the rest of the page reads and sets it), the list only picks for it.
function clientPicker(sel = $("client"), onChoose = null, ended = "all") {
  let box = null;
  const owner = { actor: ME.user?.email, nav: S.nav, hash: location.hash };
  let opened = null;
  const matches = (context) => context && ME.user?.email === context.actor && S.nav === context.nav && location.hash === context.hash;
  const permitted = () => sel.isConnected && matches(opened) && (!onChoose || matches(owner));
  let findTimer = null, emptyTimer = null, emptyTries = 0, request = 0;
  const close = () => { request++; clearTimeout(findTimer); clearTimeout(emptyTimer); opened = null; if (box) { box.remove(); box = null; document.removeEventListener("mousedown", away, true); } };
  const away = (e) => { if (box && !box.contains(e.target) && e.target !== sel) close(); };
  const open = () => {
    if (box || !sel.isConnected || (onChoose && !matches(owner))) return close();
    opened = { actor: ME.user?.email, nav: S.nav, hash: location.hash }; emptyTries = 0;
    const remote = ME.accounts && ME.user;
    // Remote choices come only from a fresh protected result, never a prior ACL snapshot.
    let list = remote ? [] : S.clientList || [], total = list.length, loading = !!remote;
    const find = el("input", { type: "search", placeholder: remote ? "Type a name or case ID" : "Type a name, a kind of case or an id", maxlength: 200, "aria-label": "Find a client", autocomplete: "off" });
    const ul = el("ul", { class: "pick-list", role: "listbox", "aria-label": "Clients" });
    const note = el("div", { class: "sub pick-note" });
    const retry = el("button", { type: "button", class: "btn small", hidden: true, onclick: () => { emptyTries = 0; refresh(); } }, "Search again");
    let shown = [], at = 0;
    const choose = (id) => {
      if (!permitted()) return close();
      const selected = shown.find((c) => c.id === id);
      close();
      if (![...sel.options].some((option) => option.value === id)) sel.append(el("option", { value: id }, clientLabel(selected || { id })));
      sel.value = id; if (onChoose) onChoose(selected || { id }); else sel.dispatchEvent(new Event("change")); sel.focus();
    };
    const draw = () => {
      const words = find.value.toLowerCase().split(/\s+/).filter(Boolean);
      const hit = remote ? list : list.filter((c) => { const hay = `${c.name || ""} ${c.kind || ""} ${c.id}`.toLowerCase(); return words.every((w) => hay.includes(w)); });
      shown = hit.slice(0, 100); at = Math.min(at, Math.max(0, shown.length - 1));
      put(ul, shown.map((c, i) => el("li", { role: "option", class: "pick-item" + (i === at ? " on" : ""), "aria-selected": String(i === at), onclick: () => choose(c.id) },
        el("div", {}, el("b", {}, c.name ? title(c.name) : c.id),
          c.restricted ? el("span", { class: "badge legal", style: "margin-left:6px", title: "Open to attorneys and the staff named on the case only" }, "Restricted") : null,
          c.blocking ? el("span", { class: "badge blocking", style: "margin-left:6px" }, `${c.blocking} blocking`) : null),
        el("div", { class: "sub" }, [c.kind, c.id].filter(Boolean).join(" · ")))));
      const count = remote ? total : hit.length;
      put(note, loading ? "Searching accessible cases…" : hit.length ? (count > shown.length ? `Showing the first ${shown.length} of ${count}: type more of the name.` : `${count} client${count === 1 ? "" : "s"}`) : remote ? "No client matches the current accessible results. Try again shortly or change the search." : "No client matches. Try another spelling, or the id.");
      retry.hidden = !remote || loading || !!hit.length;
      ul.querySelector(".on")?.scrollIntoView({ block: "nearest" });
    };
    const refresh = async () => {
      if (!box?.isConnected || !permitted()) { close(); return; }
      if (!remote) { draw(); return; }
      const current = ++request;
      loading = true;
      put(note, "Searching accessible cases…");
      try {
        const result = await api("/api/case-list?" + q({ scope: "all", q: find.value.trim(), size: 50, ended }));
        if (!permitted()) { close(); return; }
        if (request !== current || !box || !box.isConnected) return;
        list = result.clients; total = result.total;
        // A safe roster reread can temporarily omit a row. Every empty query gets
        // the same finite retries, including hidden and nonexistent case names.
        if (!list.length && emptyTries < 3) {
          emptyTries++; loading = true; draw(); emptyTimer = setTimeout(refresh, 500);
        } else { loading = false; draw(); }
      } catch (error) { if (!permitted()) { close(); return; } if (request === current && box?.isConnected) { loading = false; put(note, error.message); } }
    };
    find.addEventListener("input", () => {
      request++; at = 0; emptyTries = 0; clearTimeout(emptyTimer);
      if (remote) { list = []; total = 0; loading = true; draw(); }
      clearTimeout(findTimer); findTimer = setTimeout(refresh, 200);
    });
    find.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); at = Math.min(shown.length - 1, at + 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); at = Math.max(0, at - 1); draw(); }
      else if (e.key === "Enter") { e.preventDefault(); if (shown[at]) choose(shown[at].id); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); sel.focus(); }
    });
    box = el("div", { class: "pick", id: "client-pick" }, find, ul, note, retry);
    const r = sel.getBoundingClientRect();
    box.style.top = r.bottom + 4 + "px"; box.style.left = Math.max(8, Math.min(r.left, innerWidth - 440)) + "px";
    document.body.append(box);
    document.addEventListener("mousedown", away, true);
    draw(); find.focus(); refresh();
  };
  sel.addEventListener("mousedown", (e) => { if (!(S.clientList || []).length && !ME.user) return; e.preventDefault(); open(); });
  sel.addEventListener("keydown", (e) => { if (((S.clientList || []).length || ME.user) && ["Enter", " ", "ArrowDown", "ArrowUp"].includes(e.key)) { e.preventDefault(); open(); } });
  return close;
}

// The Search box's words: in full where the box has room for them, else the one word (a box cut to "Search doc" read as broken)
function fitSearchWords() {
  const box = $("find-q"), full = "Search documents";
  if (!box || box === document.activeElement) return;
  const css = getComputedStyle(box), ctx = (fitSearchWords.c ||= document.createElement("canvas")).getContext("2d");
  ctx.font = `${css.fontStyle} ${css.fontWeight} ${css.fontSize} ${css.fontFamily}`;
  const room = box.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
  box.placeholder = room > 0 && ctx.measureText(full).width <= room ? full : "Search";
}
