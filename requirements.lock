# the translator was tested with the newer one, see decisions.md 10/02/2026)
# Check it for known vulnerabilities:   bash tools/check_deps.sh   (pip-audit; register item dependency_scan)
# Regenerate after an upgrade passes the whole test suite:   pip freeze > requirements.lock   (then put this header back)
